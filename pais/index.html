<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DesafIA — Portal dos pais</title>
  <meta name="description" content="Portal dos responsáveis do DesafIA.">
  <meta name="theme-color" content="#7658F5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img class="brand-logo" src="/icons/icon-192.png" alt=""><span><strong>DesafIA.app</strong><small>Portal dos pais</small></span></a>
    <div class="top-actions"><a class="game-link" href="/" aria-label="Voltar ao jogo">← <span>Jogo</span></a><select id="familySelect" class="family-select" hidden></select><button id="logoutBtn" class="link-btn" hidden>Sair</button></div>
  </header>
  <main class="page">
    <section id="authView" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-hero"><img class="auth-logo" src="/icons/icon-192.png" alt="Logo DesafIA.app"></div>
        <h1>Rotina leve. Progresso visível.</h1>
        <p>Entre para acompanhar missões, aprovar conquistas e cuidar do mundo do personagem junto com a criança.</p>
        <div class="stack auth-actions">
          <button id="googleLoginBtn" class="google-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.2-2.07H12v3.92h5.37a4.58 4.58 0 0 1-1.99 3v2.54h3.23c1.89-1.74 2.99-4.31 2.99-7.39Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.89 6.61-2.38l-3.23-2.54c-.89.6-2.03.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.08v2.61A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.92A6.02 6.02 0 0 1 6.1 12c0-.67.11-1.32.31-1.92V7.47H3.08A10 10 0 0 0 2 12c0 1.61.38 3.14 1.08 4.53l3.33-2.61Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.83 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.92 5.47l3.33 2.61C7.2 7.72 9.4 5.96 12 5.96Z"/></svg>
            <span>Continuar com Google</span>
          </button>
          <div id="loginError" class="error auth-error" aria-live="polite"></div>
        </div>
        <p class="fine brand-credit">DesafIA.app <span>|</span> Desenvolvido por BigCorps <span>|</span> Tecnologia minhAi</p>
      </div>
    </section>
    <section id="setupView" class="setup-wrap" hidden></section>
    <section id="appView" hidden>
      <div id="welcome" class="welcome"></div>
      <nav class="parent-nav" aria-label="Seções do portal">
        <button data-tab="hoje" class="active">Hoje <span id="pendingBadge"></span></button>
        <button data-tab="familia">Família</button>
        <button data-tab="rotina">Rotina</button>
        <button data-tab="premios">Prêmios</button>
        <button data-tab="desafios">Desafios</button>
        <button data-tab="liga">Liga</button>
        <button data-tab="jogos">Jogos</button>
        <button data-tab="config">Config.</button>
      </nav>
      <div id="view"></div>
    </section>
  </main>
  <div class="modal" id="infoModal" role="dialog" aria-modal="true"><div class="modal-card"><div id="modalBody"></div><button class="btn btn-soft btn-block" id="modalClose">Fechar</button></div></div>
  <div class="toast" id="toast"><strong id="toastTitle"></strong><span id="toastText"></span></div>
  <script type="module" src="/src/pais/main.js"></script>
</body>
</html>
