name: Android (TWA)

# O projeto Android é gerado uma vez pelo Bubblewrap em android/twa.
# Depois: Actions → Android (TWA) → Run workflow.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir projeto Android
        run: |
          if [ ! -f android/twa/gradlew ]; then
            echo "::error::Projeto Android não encontrado em android/twa. Gere com o Bubblewrap (android/README.md)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restaurar chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/desafia.keystore"

      - name: Gerar AAB
        working-directory: android/twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Assinar AAB
        working-directory: android/twa
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/desafia.keystore" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            "$AAB" "$KEY_ALIAS"
          cp "$AAB" "$GITHUB_WORKSPACE/desafia-release.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: desafia-aab
          path: desafia-release.aab

      - name: Apagar chave
        if: always()
        run: rm -f "$RUNNER_TEMP/desafia.keystore"
