name: Web check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare assetlinks check before Bubblewrap
        run: |
          if [ ! -f public/.well-known/assetlinks.json ]; then
            mkdir -p public/.well-known
            printf '[]\n' > public/.well-known/assetlinks.json
          fi
      - run: npm run check
      - run: npm run build
